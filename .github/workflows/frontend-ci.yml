name: Frontend CI/CD

on:
  push:
    branches:
      - development

  pull_request:
    branches:
      - development

  workflow_dispatch:

jobs:
  frontend-ci:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Build frontend
        run: npm run build

  docker-push:
    name: Build & Push Frontend Docker Image
    runs-on: ubuntu-latest
    needs: frontend-ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/development'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ascend-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ascend-frontend:${{ github.sha }}

  deploy:
    name: Deploy to Linux Server
    runs-on: self-hosted
    needs: docker-push

    if: github.event_name == 'push' && github.ref == 'refs/heads/development'

    steps:
      - name: Deploy application
        run: |
          cd ~/AI-Portfolio-Platform-UI

          echo "Pulling latest Docker images..."
          docker compose --env-file compose.env pull

          echo "Starting updated containers..."
          docker compose --env-file compose.env up -d --remove-orphans

          echo "Deployment completed."

      - name: Verify deployment
        run: |
          cd ~/AI-Portfolio-Platform-UI

          echo "Container status:"
          docker compose --env-file compose.env ps

          echo "API health:"
          curl --fail http://localhost:7043/health

          echo "Deployment verification successful."
